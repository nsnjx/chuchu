<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport: injected by Flutter Web at build time -->
  <meta name="theme-color" content="#F6339A">
  <meta name="description" content="A decentralized content subscription platform based on the Nostr protocol, with a built-in Lightning wallet, enabling creators to earn directly and users to easily subscribe to quality content">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chuchu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/assets/images/chuchu_ico.ico?v=20241128">
  <link rel="alternate icon" type="image/png" href="favicon.png?v=20241128">

  <title>chuchu</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E2E8F0;
      border-top-color: #F6339A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading .text {
      margin-top: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #64748B;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text">Loading...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
